<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ livro['titulo'] }}</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #333; overflow: hidden; }
        .nav { height: 50px; background: #222; color: white; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
        iframe { width: 100%; height: calc(100% - 50px); border: none; }
        .btn-voltar { color: white; text-decoration: none; font-weight: bold; background: #444; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/" class="btn-voltar">🔙 Sair</a>
        <span>{{ livro['titulo'] }}</span>
        <div></div>
    </div>
    
    <iframe src="/uploads/{{ livro['titulo'] }}#toolbar=0"></iframe>

    <script>
        // O progresso em PDFs com imagens é salvo via interação
        setInterval(() => {
            fetch('/salvar_progresso', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: {{ livro['id'] }}, pos: 0, dark: 0})
            });
        }, 15000);
    </script>
</body>
</html>
