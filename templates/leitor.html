<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .upload-section { border: 2px dashed #cbd5e0; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 30px; }
        .btn-upload { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .livro-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #edf2f7; }
        .btn-ler { text-decoration: none; background-color: #3182ce; color: white; padding: 8px 16px; border-radius: 4px; font-size: 14px; }
        .vazio { text-align: center; color: #a0aec0; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 Meus Livros</h2>
        
        <div class="upload-section">
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".pdf" required style="font-size: 14px;">
                <button type="submit" class="btn-upload">Enviar PDF</button>
            </form>
        </div>

        <div id="lista-livros">
            {% for livro in livros %}
            <div class="livro-item">
                <span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">{{ livro['titulo'] }}</span>
                <a href="/ler/{{ livro['id'] }}" class="btn-ler">Ler Agora</a>
            </div>
            {% endfor %}
            
            {% if not livros %}
            <p class="vazio">Nenhum livro disponível na estante.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
