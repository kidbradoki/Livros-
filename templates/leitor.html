<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Andressa Reader - Leitura Total</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { background: #000; color: #ff69b4; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .topo { background: #111; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff69b4; position: sticky; top: 0; z-index: 100; }
        
        /* Centraliza o livro e permite o scroll vertical natural */
        #main-container { width: 100vw; display: flex; justify-content: center; background: #000; }
        #canvas-wrapper { position: relative; box-shadow: 0 0 15px rgba(255,105,180,0.3); }
        
        #pdf-render { display: block; max-width: 100%; height: auto; }
        
        #highlight-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 5; 
            mix-blend-mode: multiply; 
            touch-action: none; /* Importante para o grifador não bugar no toque */
        }

        .controles { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.95); padding: 10px 20px; border-radius: 35px; border: 1px solid #ff69b4; display: flex; gap: 20px; z-index: 1000; }
        button { background: #ff69b4; border: none; padding: 8px 15px; border-radius: 12px; font-weight: bold; color: #fff; }
        .btn-limpar { background: #ff4141; font-size: 10px; }
    </style>
</head>
<body>
    <div class="topo">
        <a href="/" style="color: #ff69b4; text-decoration: none; font-weight: bold;">< VOLTAR</a>
        <span id="book-title" style="font-size: 0.7rem; color: #eee;">Andressa Reader</span>
        <button class="btn-limpar" onclick="limparGrifos()">LIMPAR</button>
    </div>

    <div id="main-container">
        <div id="canvas-wrapper">
            <canvas id="pdf-render"></canvas>
            <canvas id="highlight-canvas"></canvas>
        </div>
    </div>

    <div class="controles">
        <button onclick="changePage(-1)"> << </button>
        <span id="p-num" style="font-weight: bold;">1</span>
        <button onclick="changePage(1)"> >> </button>
    </div>

    <script>
        const pdfData = sessionStorage.getItem('temp_pdf');
        const pdfName = localStorage.getItem('andressa_pdf_name');
        const bookId = btoa(pdfName || "default");
        let pdfDoc = null, pageNum = 1, isDrawing = false, currentPath = [];

        const canvas = document.getElementById('pdf-render');
        const hCanvas = document.getElementById('highlight-canvas');
        const ctx = canvas.getContext('2d');
        const hCtx = hCanvas.getContext('2d');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        if (!pdfData) window.location.href = '/';
        document.getElementById('book-title').innerText = pdfName;

        pdfjsLib.getDocument(pdfData).promise.then(pdf => {
            pdfDoc = pdf;
            const saved = localStorage.getItem('and_p_' + bookId);
            pageNum = saved ? parseInt(saved) : 1;
            renderPage(pageNum);
        });

        function renderPage(num) {
            pdfDoc.getPage(num).then(page => {
                // AJUSTE DE ESCALA DINÂMICO
                const windowWidth = window.innerWidth;
                const unscaledViewport = page.getViewport({ scale: 1 });
                const scale = windowWidth / unscaledViewport.width; // Faz o PDF ocupar 100% da largura da tela
                const viewport = page.getViewport({ scale: scale });

                canvas.height = hCanvas.height = viewport.height;
                canvas.width = hCanvas.width = viewport.width;
                
                const wrapper = document.getElementById('canvas-wrapper');
                wrapper.style.width = viewport.width + 'px';
                wrapper.style.height = viewport.height + 'px';

                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                    localStorage.setItem('and_p_' + bookId, num);
                    carregarGrifos(num);
                });
                document.getElementById('p-num').innerText = num;
                window.scrollTo(0, 0);
            });
        }

        // Lógica de Grifos (Mantida com os ajustes de precisão)
        function carregarGrifos(p) {
            const grifos = JSON.parse(localStorage.getItem('and_g_' + bookId + '_' + p) || "[]");
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hCtx.strokeStyle = "rgba(255, 255, 0, 0.8)";
            hCtx.lineWidth = 20; 
            hCtx.lineCap = "round"; hCtx.lineJoin = "round";

            grifos.forEach(path => {
                if (path.length < 2) return;
                hCtx.beginPath();
                hCtx.moveTo(path[0].x, path[0].y);
                path.forEach(pt => hCtx.lineTo(pt.x, pt.y));
                hCtx.stroke();
            });
        }

        function getPos(e) {
            const rect = hCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { 
                x: (clientX - rect.left) * (hCanvas.width / rect.width), 
                y: (clientY - rect.top) * (hCanvas.height / rect.height)
            };
        }

        function startDrawing(e) { isDrawing = true; currentPath = []; const pos = getPos(e); hCtx.beginPath(); hCtx.moveTo(pos.x, pos.y); currentPath.push(pos); }
        function draw(e) { if (!isDrawing) return; const pos = getPos(e); hCtx.lineTo(pos.x, pos.y); hCtx.stroke(); currentPath.push(pos); }
        function stopDrawing() { 
            if (!isDrawing) return; isDrawing = false; 
            const key = 'and_g_' + bookId + '_' + pageNum;
            const grifos = JSON.parse(localStorage.getItem(key) || "[]");
            grifos.push(currentPath); localStorage.setItem(key, JSON.stringify(grifos));
        }

        function changePage(delta) { if (!pdfDoc || (pageNum + delta < 1) || (pageNum + delta > pdfDoc.numPages)) return; pageNum += delta; renderPage(pageNum); }
        function limparGrifos() { if(confirm("Apagar grifos desta página?")) { localStorage.removeItem('and_g_' + bookId + '_' + pageNum); renderPage(pageNum); } }

        hCanvas.addEventListener('mousedown', startDrawing); hCanvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stopDrawing);
        hCanvas.addEventListener('touchstart', startDrawing); hCanvas.addEventListener('touchmove', draw); hCanvas.addEventListener('touchend', stopDrawing);
    </script>
</body>
</html>
