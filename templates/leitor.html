<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lendo: {{ livro['titulo'] }}</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #1a202c; }
        .topo-menu { height: 50px; background-color: #2d3748; color: white; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; position: relative; z-index: 10; font-family: sans-serif; }
        .btn-voltar { color: #edf2f7; text-decoration: none; font-size: 14px; background: #4a5568; padding: 6px 12px; border-radius: 4px; }
        .pdf-container { height: calc(100% - 50px); width: 100%; border: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="topo-menu">
        <a href="/" class="btn-voltar">🔙 Sair</a>
        <span style="font-size: 13px; font-weight: bold; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            {{ livro['titulo'] }}
        </span>
        <div style="width: 40px;"></div>
    </div>

    <div class="pdf-container">
        <iframe src="/uploads/{{ livro['titulo'] }}#toolbar=0" allow="fullscreen"></iframe>
    </div>
</body>
</html>
