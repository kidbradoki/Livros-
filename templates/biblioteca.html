<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Andressa Reader - Biblioteca</title>
    <style>
        body { background: #0a0a0a; color: #ff69b4; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 50px auto; border: 2px solid #ff69b4; padding: 30px; border-radius: 20px; box-shadow: 0 0 20px rgba(255, 105, 180, 0.2); }
        .btn-upload { background: #ff69b4; color: #fff; padding: 15px; border-radius: 10px; cursor: pointer; display: block; margin-top: 25px; font-weight: bold; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 ANDRESSA READER</h2>
        <p>Escolha um livro do seu dispositivo para ler.</p>
        <label class="btn-upload">
            ABRIR ARQUIVO PDF
            <input type="file" id="file-selector" accept="application/pdf">
        </label>
    </div>

    <script>
        document.getElementById('file-selector').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function() {
                    // Armazena apenas o nome para recuperar a página certa depois
                    sessionStorage.setItem('temp_pdf', this.result);
                    localStorage.setItem('andressa_pdf_name', file.name);
                    window.location.href = '/leitor';
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
