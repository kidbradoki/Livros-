<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andressa Reader - Minha Estante</title>
    <style>
        body { background: #0a0a0a; color: #ff69b4; font-family: sans-serif; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: 20px auto; border: 2px solid #ff69b4; padding: 20px; border-radius: 25px; box-shadow: 0 0 25px rgba(255, 105, 180, 0.2); background: #111; }
        
        .grid-pastas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .pasta { background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 15px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        .pasta.active { border-color: #ff69b4; background: rgba(255, 105, 180, 0.1); box-shadow: 0 0 10px #ff69b4; color: #fff; }
        .icon { font-size: 1.5rem; display: block; margin-bottom: 5px; }

        /* Lista de Livros Salvos */
        #lista-livros { text-align: left; margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .livro-item { background: #1a1a1a; margin-bottom: 10px; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #ff69b4; }
        .livro-info { flex-grow: 1; color: #eee; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        
        .btn-abrir { background: #ff69b4; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-remover { color: #ff4141; background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-left: 10px; }

        .btn-upload-label { background: #ff69b4; color: #fff; padding: 15px; border-radius: 12px; cursor: pointer; display: block; margin-top: 20px; font-weight: bold; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="letter-spacing: 2px;">🎀 ANDRESSA READER</h2>
        
        <div class="grid-pastas">
            <div class="pasta active" id="p-Lendo" onclick="mudarPasta('Lendo')">
                <span class="icon">📖</span>Lendo
            </div>
            <div class="pasta" id="p-Quero" onclick="mudarPasta('Quero Ler')">
                <span class="icon">📑</span>Quero
            </div>
            <div class="pasta" id="p-Lidos" onclick="mudarPasta('Lidos')">
                <span class="icon">✅</span>Lidos
            </div>
        </div>

        <div id="lista-livros">
            </div>

        <label class="btn-upload-label">
            + ADICIONAR NOVO PDF
            <input type="file" id="file-selector" accept="application/pdf">
        </label>
    </div>

    <script>
        let pastaAtual = "Lendo";

        // Carrega os livros salvos ao abrir
        window.onload = listarLivros;

        function mudarPasta(novaPasta) {
            pastaAtual = novaPasta;
            document.querySelectorAll('.pasta').forEach(p => p.classList.remove('active'));
            const id = novaPasta === 'Quero Ler' ? 'p-Quero' : 'p-' + novaPasta;
            document.getElementById(id).classList.add('active');
            listarLivros();
        }

        function listarLivros() {
            const container = document.getElementById('lista-livros');
            const livros = JSON.parse(localStorage.getItem('biblioteca_andressa') || "[]");
            const filtrados = livros.filter(l => l.pasta === pastaAtual);

            if (filtrados.length === 0) {
                container.innerHTML = `<p style="color: #666; text-align: center;">Nenhum livro em "${pastaAtual}"</p>`;
                return;
            }

            container.innerHTML = filtrados.map(livro => `
                <div class="livro-item">
                    <div class="livro-info">${livro.nome}</div>
                    <button class="btn-abrir" onclick="abrirLivro('${livro.id}')">LER</button>
                    <button class="btn-remover" onclick="removerLivro('${livro.id}')">×</button>
                </div>
            `).join('');
        }

        document.getElementById('file-selector').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function() {
                const base64 = this.result;
                const livroId = 'pdf_' + Date.now();
                
                // 1. Salva o conteúdo do PDF
                localStorage.setItem(livroId, base64);
                
                // 2. Adiciona à lista da biblioteca
                const biblioteca = JSON.parse(localStorage.getItem('biblioteca_andressa') || "[]");
                biblioteca.push({
                    id: livroId,
                    nome: file.name,
                    pasta: pastaAtual
                });
                localStorage.setItem('biblioteca_andressa', JSON.stringify(biblioteca));
                
                listarLivros();
            };
            reader.readAsDataURL(file);
        };

        function abrirLivro(id) {
            const biblioteca = JSON.parse(localStorage.getItem('biblioteca_andressa') || "[]");
            const livro = biblioteca.find(l => l.id === id);
            const pdfData = localStorage.getItem(id);

            if (pdfData) {
                sessionStorage.setItem('temp_pdf', pdfData);
                localStorage.setItem('andressa_pdf_name', livro.nome);
                window.location.href = '/leitor';
            }
        }

        function removerLivro(id) {
            if (confirm("Remover este livro da estante?")) {
                let biblioteca = JSON.parse(localStorage.getItem('biblioteca_andressa') || "[]");
                biblioteca = biblioteca.filter(l => l.id !== id);
                localStorage.setItem('biblioteca_andressa', JSON.stringify(biblioteca));
                localStorage.removeItem(id); // Limpa o PDF da memória
                listarLivros();
            }
        }
    </script>
</body>
</html>
