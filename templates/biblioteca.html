<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Biblioteca ANDRESSA</title>
    <style>
        body { background: #0a0a0a; color: #00FF41; font-family: monospace; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; border: 1px solid #00FF41; padding: 20px; border-radius: 10px; }
        .btn-upload { background: #00FF41; color: #000; padding: 15px; border-radius: 5px; cursor: pointer; display: block; margin-top: 20px; text-decoration: none; font-weight: bold; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 MEUS LIVROS</h2>
        <p>Selecione um PDF para iniciar a leitura com persistência.</p>
        <label class="btn-upload">
            CARREGAR NOVO LIVRO
            <input type="file" id="file-selector" accept="application/pdf">
        </label>
    </div>

    <script>
        document.getElementById('file-selector').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function() {
                    // Salva o PDF temporariamente no navegador e vai para o leitor
                    localStorage.setItem('current_pdf', this.result);
                    localStorage.setItem('current_pdf_name', file.name);
                    window.location.href = '/leitor';
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
