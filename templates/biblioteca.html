<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Andressa Reader - Biblioteca</title>
    <style>
        body { background: #0a0a0a; color: #ff69b4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 50px auto; border: 2px solid #ff69b4; padding: 30px; border-radius: 20px; box-shadow: 0 0 20px rgba(255, 105, 180, 0.2); }
        h2 { letter-spacing: 2px; }
        .btn-upload { background: #ff69b4; color: #fff; padding: 15px; border-radius: 10px; cursor: pointer; display: block; margin-top: 25px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-upload:hover { background: #ff1493; transform: scale(1.05); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 ANDRESSA READER</h2>
        <p>Selecione seu livro favorito para começar.</p>
        <label class="btn-upload">
            CARREGAR LIVRO
            <input type="file" id="file-selector" accept="application/pdf">
        </label>
    </div>

    <script>
        document.getElementById('file-selector').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function() {
                    localStorage.setItem('andressa_pdf', this.result);
                    localStorage.setItem('andressa_pdf_name', file.name);
                    window.location.href = '/leitor';
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
