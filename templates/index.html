<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ livro[0] }}</title>
    <style>
        body { font-family: sans-serif; transition: 0.3s; margin: 0; padding: 20px; line-height: 1.7; }
        body.dark { background: #1a1a1a; color: #e0e0e0; }
        #controles { position: fixed; top: 0; left: 0; width: 100%; background: #333; color: white; padding: 10px; display: flex; justify-content: space-between; z-index: 100; }
        .conteudo { margin-top: 60px; white-space: pre-wrap; font-size: 18px; }
        button { padding: 10px; border-radius: 5px; border: none; cursor: pointer; }
    </style>
</head>
<body id="body">
    <div id="controles">
        <a href="/" style="color:white">⬅ Voltar</a>
        <span>{{ livro[0] }}</span>
        <button onclick="toggleDark()">🌙 Modo</button>
    </div>

    <div class="conteudo" id="texto">{{ livro[1] }}</div>

    <script>
        const livroId = {{ id }};
        const posInicial = {{ pos }};

        // Recupera posição ao carregar
        window.onload = () => {
            window.scrollTo(0, posInicial);
            if(localStorage.getItem('dark') === 'true') toggleDark();
        };

        // Salva posição ao rolar (Debounce de 1s para economizar servidor)
        let timer;
        window.onscroll = () => {
            localStorage.setItem('pos_' + livroId, window.scrollY);
            clearTimeout(timer);
            timer = setTimeout(() => {
                fetch('/salvar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: livroId, pos: window.scrollY})
                });
            }, 1000);
        };

        function toggleDark() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('dark', isDark);
        }
    </script>
</body>
</html>
